<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账房 ERP · 进销存与财务管理</title>
<meta name="description" content="账房 ERP：涵盖仪表盘、客户、产品、销售、采购、出入库、库存、财务对账、账号管控与系统设置的进销存一体化管理系统">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23c23a26'/%3E%3Cpath d='M14 16h36v6H14zM20 28h24v4H20zM14 40h36v8H14z' fill='%23faf8f1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   账房 ERP · 样式系统
   视觉方向：中式账房账页 + 工程蓝图角码
   ============================================================ */
:root{
  --paper:#ece9df;            /* 页面纸张 */
  --paper-2:#e4e0d3;          /* 更深纸张 */
  --surface:#faf8f1;          /* 卡片纸面 */
  --surface-2:#f3efe4;        /* 内嵌纸面 */
  --ink:#212b3c;              /* 墨色（偏蓝黑） */
  --ink-2:#5c6676;            /* 次墨 */
  --ink-3:#979eab;            /* 淡墨 */
  --line:rgba(33,43,60,.14);  /* 发丝线 */
  --line-2:rgba(33,43,60,.30);/* 实线 */
  --verm:#c23a26;             /* 朱砂（品牌/审核章） */
  --verm-2:#9e2f1e;
  --verm-bg:rgba(194,58,38,.08);
  --teal:#147d74;             /* 青（入库/完成） */
  --teal-2:#0e5f58;
  --teal-bg:rgba(20,125,116,.09);
  --amber:#a97c11;            /* 琥珀（待办） */
  --amber-bg:rgba(169,124,17,.10);
  --blue:#3a5a9c;             /* 靛蓝（信息） */
  --blue-bg:rgba(58,90,156,.08);
  --danger:#b3261e;
  --serif:'Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Mono','SFMono-Regular',Consolas,monospace;
  --r:2px;
  --shadow:0 1px 2px rgba(33,43,60,.06),0 6px 18px rgba(33,43,60,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  font-size:14px;line-height:1.6;min-height:100vh;
  background-image:
    linear-gradient(0deg, rgba(33,43,60,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,43,60,.028) 1px, transparent 1px);
  background-size:22px 22px;
}
::selection{background:rgba(194,58,38,.18)}
a{color:var(--verm-2);text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit;font-size:14px}
img{max-width:100%}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--verm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{padding:14px 12px 64px;flex:1;min-width:0}
.mask{position:fixed;inset:0;background:rgba(33,43,60,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}

/* ===== 侧边栏：卷宗索引 ===== */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:238px;z-index:70;
  background:var(--surface-2);border-right:1px solid var(--line-2);
  transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;
}
.sidebar.on{transform:translateX(0);box-shadow:var(--shadow)}
.side-inner{display:flex;flex-direction:column;height:100%;overflow-y:auto;padding-bottom:10px}
.brand{
  display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line);
}
.brand-fold{cursor:pointer;user-select:none;transition:background .15s ease}
.brand-fold:hover{background:rgba(33,43,60,.05)}
.fold-ind{
  margin-left:auto;width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);opacity:.75;transition:opacity .15s ease;
}
.brand-fold:hover .fold-ind{opacity:1;color:var(--verm)}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:5px;background:var(--verm);position:relative;
  display:block;
}
.brand-mark::before{content:"";position:absolute;left:7px;top:9px;right:7px;height:4px;background:var(--surface)}
.brand-mark::after{content:"";position:absolute;left:7px;top:17px;right:7px;height:12px;border:2px solid var(--surface);border-top:none}
.brand-name{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1.2}
.brand-sub{font-size:11px;color:var(--ink-2);letter-spacing:.14em;margin-top:2px}
.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-label{padding:10px 8px 4px;font-size:11px;letter-spacing:.22em;color:var(--ink-3);font-weight:500}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:3px;cursor:pointer;
  color:var(--ink-2);position:relative;user-select:none;min-height:40px;font-size:14px;
}
.nav-item:hover{background:rgba(33,43,60,.06);color:var(--ink)}
.nav-item.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--verm)}
.nav-ic{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center}
.nav-ic svg{width:18px;height:18px}
.side-user{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.user-av{
  width:34px;height:34px;flex:0 0 34px;border-radius:4px;background:var(--ink);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;
}
.user-meta{min-width:0}
.user-name{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.08em}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  background:var(--surface);border-bottom:1px solid var(--line-2);padding:10px 12px;min-height:56px;
}
.menu-btn{display:none}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.crumb-home{font-family:var(--serif);font-weight:700;letter-spacing:.05em}
.crumb-sep{color:var(--ink-3);font-size:12px}
.crumb-cur{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.searchbox{position:relative;display:none}
.search-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:flex}
.search-ic svg{width:16px;height:16px}
#searchInput{
  width:230px;height:36px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);
  padding:0 12px 0 32px;font-size:13px;transition:border-color .15s;
}
#searchInput:focus{border-color:var(--verm);background:var(--surface);outline:none}
.icon-btn{
  width:38px;height:38px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);position:relative;border:1px solid transparent;
}
.icon-btn:hover{background:rgba(33,43,60,.06);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.badge{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--verm);
  color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-family:var(--mono);
}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:3px 6px 3px 3px;border-radius:4px;border:1px solid transparent;min-height:40px;
}
.user-chip:hover{background:rgba(33,43,60,.06)}
.user-chip .user-av{width:30px;height:30px;flex-basis:30px;font-size:13px}
.user-meta{display:none}

/* ===== 卡片（角码装饰） ===== */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;
  box-shadow:var(--shadow);padding:16px;
}
.card::before,.card::after{
  content:"";position:absolute;width:11px;height:11px;pointer-events:none;
}
.card::before{top:-1px;left:-1px;border-top:2px solid var(--line-2);border-left:2px solid var(--line-2)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--line-2);border-right:2px solid var(--line-2)}
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.05em;line-height:1.3}
.card-title .cn-num{font-family:var(--mono);font-size:12px;color:var(--verm);margin-right:8px;vertical-align:2px}
.card-sub{font-size:12px;color:var(--ink-2);margin-top:2px;letter-spacing:.02em}
.card-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-body{min-width:0}

/* ===== 页面标题条 ===== */
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.page-title .sep{color:var(--verm);margin:0 6px}
.page-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:3px;letter-spacing:.04em}
.page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;
  padding:0 14px;font-size:13.5px;border-radius:var(--r);font-weight:500;letter-spacing:.02em;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));
  transition:background .15s,border-color .15s,color .15s;
}
.btn svg{width:15px;height:15px}
.btn-verm{background:var(--verm);color:#fff}
.btn-verm:hover{background:var(--verm-2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-2)}
.btn-ghost{border:1px solid var(--line-2);background:transparent;color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);background:rgba(33,43,60,.05)}
.btn-ink{background:var(--ink);color:var(--surface)}
.btn-ink:hover{background:#303b4e}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-sm{min-height:30px;padding:0 10px;font-size:12.5px;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}

/* ===== KPI ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;
  box-shadow:var(--shadow);overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--verm)}
.kpi.teal::before{background:var(--teal)}
.kpi.amber::before{background:var(--amber)}
.kpi.blue::before{background:var(--blue)}
.kpi-label{font-size:11.5px;color:var(--ink-2);letter-spacing:.16em;display:flex;align-items:center;gap:5px}
.kpi-label svg{width:13px;height:13px;color:var(--ink-3)}
.kpi-num{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.3;margin-top:4px;white-space:nowrap}
.kpi-num small{font-size:13px;color:var(--ink-2);font-weight:500;margin-left:2px}
.kpi-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi-sub b{color:var(--verm-2);font-weight:600}

/* ===== 图表网格 ===== */
.chart-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media (min-width:900px){
  .chart-grid.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .chart-grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
.chart-box{min-height:300px;width:100%}
.chart-foot{font-size:11.5px;color:var(--ink-3);margin-top:6px;text-align:right;letter-spacing:.04em}

/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.tbl th{
  text-align:left;font-size:11.5px;letter-spacing:.12em;color:var(--ink-2);font-weight:500;
  padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2);
}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:rgba(194,58,38,.045)}
.tbl .row-click{cursor:pointer}
.tbl .t-strong{font-weight:600}
.tbl .t-money{font-family:var(--serif);font-variant-numeric:tabular-nums;font-weight:600}
.tbl .t-num{font-variant-numeric:tabular-nums}
.tbl-empty{text-align:center;color:var(--ink-3);padding:36px 12px;font-size:13px;letter-spacing:.05em}
.tbl-empty b{color:var(--ink-2)}
.row-ops{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{
  min-height:26px;padding:0 8px;font-size:12px;border:1px solid var(--line-2);border-radius:2px;
  color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
}
.mini-btn:hover{border-color:var(--ink);color:var(--ink);background:rgba(33,43,60,.04)}
.mini-btn.verm{color:var(--verm-2);border-color:rgba(194,58,38,.4)}
.mini-btn.verm:hover{background:var(--verm-bg);border-color:var(--verm)}
.mini-btn.teal{color:var(--teal-2);border-color:rgba(20,125,116,.4)}
.mini-btn.teal:hover{background:var(--teal-bg);border-color:var(--teal)}
.mini-btn.danger{color:var(--danger);border-color:rgba(179,38,30,.4)}
.mini-btn.danger:hover{background:rgba(179,38,30,.07)}
.mini-btn svg{width:13px;height:13px}

/* ===== 印章状态 ===== */
.stamp{
  display:inline-flex;align-items:center;gap:4px;padding:1px 9px;font-size:11.5px;letter-spacing:.22em;
  border-radius:2px;white-space:nowrap;line-height:1.7;font-weight:500;
}
.stamp svg{width:12px;height:12px}
.st-verm{border:1.5px solid var(--verm);color:var(--verm-2);background:var(--verm-bg)}
.st-teal{border:1.5px solid var(--teal);color:var(--teal-2);background:var(--teal-bg)}
.st-amber{border:1.5px dashed var(--amber);color:#8a6410;background:var(--amber-bg)}
.st-blue{border:1.5px solid var(--blue);color:#2c4a82;background:var(--blue-bg)}
.st-ink{border:1.5px solid var(--ink-2);color:var(--ink-2);background:rgba(33,43,60,.05)}
.st-gray{border:1.5px dashed var(--ink-3);color:var(--ink-3);background:transparent}

/* ===== 标签 / 提示 ===== */
.tag{
  display:inline-flex;align-items:center;padding:0 8px;min-height:22px;font-size:12px;border-radius:2px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);letter-spacing:.04em;
}
.tag.verm{color:var(--verm-2);border-color:rgba(194,58,38,.35);background:var(--verm-bg)}
.tag.teal{color:var(--teal-2);border-color:rgba(20,125,116,.35);background:var(--teal-bg)}
.tag.amber{color:#8a6410;border-color:rgba(169,124,17,.4);background:var(--amber-bg)}
.tag.blue{color:#2c4a82;border-color:rgba(58,90,156,.35);background:var(--blue-bg)}
.tipbar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:2px;font-size:12.5px;margin-bottom:14px;
  border:1px solid;letter-spacing:.02em;
}
.tipbar svg{width:15px;height:15px;flex:0 0 15px}
.tipbar.amber{border-color:rgba(169,124,17,.4);background:var(--amber-bg);color:#7c5b10}
.tipbar.blue{border-color:rgba(58,90,156,.35);background:var(--blue-bg);color:#2c4a82}
.tipbar.teal{border-color:rgba(20,125,116,.35);background:var(--teal-bg);color:#0e5f58}
.tipbar.verm{border-color:rgba(194,58,38,.35);background:var(--verm-bg);color:var(--verm-2)}

/* ===== 列表（待办/动态） ===== */
.feed{display:flex;flex-direction:column}
.feed-item{
  display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:flex-start;
  min-width:0;
}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:30px;height:30px;flex:0 0 30px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.feed-ic svg{width:15px;height:15px}
.feed-ic.verm{color:var(--verm-2);background:var(--verm-bg);border-color:rgba(194,58,38,.3)}
.feed-ic.teal{color:var(--teal-2);background:var(--teal-bg);border-color:rgba(20,125,116,.3)}
.feed-ic.amber{color:#8a6410;background:var(--amber-bg);border-color:rgba(169,124,17,.3)}
.feed-main{flex:1;min-width:0}
.feed-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feed-meta{font-size:12px;color:var(--ink-3);margin-top:1px}
.feed-right{text-align:right;flex:0 0 auto}
.feed-num{font-family:var(--serif);font-weight:700;font-size:15px;display:block}
.feed-act{font-size:11.5px;color:var(--verm-2);cursor:pointer;letter-spacing:.05em}
.feed-act:hover{text-decoration:underline}

/* ===== 表单 ===== */
.form{display:grid;grid-template-columns:1fr;gap:12px 14px}
@media (min-width:720px){.form.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:500}
.field label .req{color:var(--verm)}
.field input,.field select,.field textarea{
  height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface-2);
  font-size:14px;transition:border-color .15s,background .15s;width:100%;
}
.field textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--verm);background:var(--surface);outline:none}
.field .help{font-size:11.5px;color:var(--ink-3)}
.field .err{font-size:11.5px;color:var(--danger);display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.addr-casc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:0}
@media (max-width:560px){
  .addr-casc{grid-template-columns:1fr}
}
.form-note{font-size:12px;color:var(--ink-3);letter-spacing:.03em;padding:8px 10px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:2px}

/* 订单行编辑 */
.line-editor{display:flex;flex-direction:column;gap:8px}
.line-row{
  display:grid;grid-template-columns:minmax(120px,1.6fr) 74px 86px 84px 34px;gap:8px;align-items:center;
}
.line-row input,.line-row select{height:36px;padding:0 8px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface-2);font-size:13px;width:100%}
.line-row input:focus,.line-row select:focus{border-color:var(--verm);outline:none;background:var(--surface)}
.line-del{width:34px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:2px}
.line-del:hover{color:var(--danger);border-color:var(--danger)}
.line-sum{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 2px 0;border-top:1px solid var(--line);margin-top:4px}
.line-sum .ls{font-size:12.5px;color:var(--ink-2)}
.line-sum .ls b{font-family:var(--serif);font-size:18px;color:var(--verm);font-weight:700}

/* ===== 弹层 ===== */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;pointer-events:none}
.modal-veil{position:fixed;inset:0;background:rgba(33,43,60,.5)}
.modal{
  position:relative;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-2);border-radius:3px;box-shadow:0 18px 50px rgba(33,43,60,.3);
  pointer-events:auto;animation:modalIn .18s ease;
}
.modal.wide{max-width:820px}
@keyframes modalIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal::before,.modal::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.modal::before{top:-1px;left:-1px;border-top:2px solid var(--verm);border-left:2px solid var(--verm)}
.modal::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--verm);border-right:2px solid var(--verm)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.05em}
.modal-close{margin-left:auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:2px}
.modal-close:hover{background:rgba(33,43,60,.07);color:var(--ink)}
.modal-body{padding:18px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto;display:flex;gap:8px}

/* ===== 下拉面板 ===== */
.dropdown-root{position:fixed;z-index:300}
.dropdown{
  background:var(--surface);border:1px solid var(--line-2);border-radius:3px;box-shadow:var(--shadow);
  padding:6px;min-width:220px;max-height:min(60vh,420px);overflow-y:auto;
}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:2px;cursor:pointer;font-size:13px;min-width:0}
.dd-item:hover{background:rgba(194,58,38,.06)}
.dd-head{
  padding:8px 10px 4px;font-size:11px;letter-spacing:.18em;color:var(--ink-3);font-weight:600;
  border-top:1px solid var(--line);margin-top:4px;
}
.dd-head:first-child{border-top:none;margin-top:0}
.dd-item .ic{width:26px;height:26px;flex:0 0 26px;border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.dd-item .ic svg{width:14px;height:14px}
.dd-main{flex:1;min-width:0}
.dd-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dd-s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dd-empty{padding:18px 12px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* ===== 通知中心面板 ===== */
@keyframes bpIn{
  from{transform:translateY(-6px)}
  to{transform:translateY(0)}
}
.bell-panel{
  background:var(--surface);border:1px solid var(--line-2);border-radius:3px;box-shadow:var(--shadow);
  width:min(380px,calc(100vw - 24px));
  opacity:1;visibility:visible;
  animation:bpIn .16s ease;
  /* 相对视口 fixed 定位（bellRoot 为 0 宽 fixed 容器，absolute+right 会偏移到屏幕外） */
  position:fixed;top:88px;right:24px;
}
.bp-head{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.bp-title{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.05em}
.bp-cnt{font-size:11px;color:var(--verm);background:rgba(194,58,38,.08);padding:2px 7px;border-radius:8px}
.bp-clear{margin-left:auto;font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);padding:3px 9px;border-radius:2px;cursor:pointer}
.bp-clear:hover{color:var(--verm);border-color:var(--verm)}
.bp-list{max-height:360px;overflow-y:auto;padding:5px}
.bp-grp{display:flex;align-items:center;gap:6px;padding:8px 9px 3px;font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;border-top:1px dashed var(--line)}
.bp-grp:first-child{border-top:none}
.bp-grp svg{width:13px;height:13px;color:var(--verm)}
.bp-grp-n{margin-left:auto;font-family:var(--serif);font-size:11px;color:var(--verm)}
.bp-item{display:flex;align-items:flex-start;gap:9px;padding:9px 9px;border-radius:2px;cursor:pointer;min-width:0}
.bp-item:hover{background:rgba(33,43,60,.05)}
.bp-item.read{opacity:.55}
.bp-item.expanded{background:rgba(33,43,60,.05);border-left:2px solid var(--verm)}
.bp-item.expanded .bp-s{-webkit-line-clamp:none}
.bp-go{flex:0 0 auto;font-size:11.5px;color:var(--verm);font-weight:500;padding-top:2px;opacity:.9;white-space:nowrap}
.bp-ic{width:26px;height:26px;flex:0 0 26px;border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--verm)}
.bp-ic svg{width:14px;height:14px}
.bp-main{flex:1;min-width:0}
.bp-t{font-size:13px;font-weight:500;display:block;line-height:1.4}
.bp-s{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;margin-top:2px;word-break:break-all}
.bp-time{font-size:10.5px;color:var(--ink-3);flex:0 0 auto;padding-top:2px}
.bp-empty{padding:22px 12px;text-align:center;color:var(--ink-3);font-size:12.5px}
/* ===== 操作日志 · 登录会话列表 ===== */
.ls-list{padding:4px 0}
.ls-item{border-bottom:1px dashed var(--line)}
.ls-item:last-child{border-bottom:none}
.ls-row{display:flex;align-items:center;gap:10px;padding:11px 8px;cursor:pointer;min-width:0}
.ls-row:hover{background:rgba(33,43,60,.04)}
.ls-ic{width:30px;height:30px;flex:0 0 30px;border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--verm)}
.ls-ic svg{width:15px;height:15px}
.ls-main{flex:1;min-width:0}
.ls-t{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ls-acc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);background:var(--surface-2);padding:1px 7px;border-radius:8px}
.ls-s{font-size:12px;color:var(--ink-3);margin-top:2px;display:block}
.ls-cnt{flex:0 0 auto;font-size:12px;color:var(--verm);background:rgba(194,58,38,.08);padding:2px 8px;border-radius:8px}
.ls-arrow{flex:0 0 auto;color:var(--verm);display:flex;align-items:center}
.ls-body{display:none}
.ls-empty{padding:10px 0;color:var(--ink-3);font-size:12.5px}
/* 会话详情页 */
.ls-detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--verm);cursor:pointer;padding:6px 0 14px;background:none;border:none}
.ls-detail-back svg{width:15px;height:15px}
.ls-detail-back:hover{opacity:.8}
.ls-detail-meta{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 0 14px;font-size:12.5px;color:var(--ink-2)}
.ls-detail-meta b{font-family:var(--serif);font-weight:600;color:var(--ink)}
.ls-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.ls-th{display:grid;grid-template-columns:150px 120px 1fr;gap:8px;background:var(--surface-2);padding:7px 10px;font-size:12px;color:var(--ink-3);font-weight:600}
.ls-tr{display:grid;grid-template-columns:150px 120px 1fr;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px;align-items:start}
.ls-d{word-break:break-all}
@media (max-width:767px){
  .ls-body{padding:2px 4px 10px 4px}
  .ls-th,.ls-tr{grid-template-columns:100px 88px 1fr}
}
.search-res{position:absolute;top:44px;left:0;right:0}

/* ===== 页签 ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;overflow-x:auto}
.tab{
  padding:8px 14px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--verm-2);border-bottom-color:var(--verm);font-weight:600}
.tab .cnt{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:0 6px;line-height:16px}
.tab.active .cnt{background:var(--verm-bg);border-color:rgba(194,58,38,.35);color:var(--verm-2)}

/* ===== 工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar input[type=search],.toolbar select{
  height:36px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface-2);padding:0 10px;font-size:13px;
}
.toolbar input[type=search]{width:min(240px,100%)}
.toolbar select{padding-right:24px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--verm);outline:none;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{min-height:34px;padding:0 12px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--surface)}

/* ===== 对账 / 明细 ===== */
.detail-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
@media (min-width:860px){.detail-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr)}}
.sum-rows{display:flex;flex-direction:column;gap:0}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.sum-row:last-child{border-bottom:none}
.sum-row .k{color:var(--ink-2)}
.sum-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.sum-row.total .v{font-family:var(--serif);font-size:16px;color:var(--verm)}

/* ===== 锁屏 ===== */
.lock{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;background-image:linear-gradient(0deg,rgba(33,43,60,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(33,43,60,.03) 1px,transparent 1px);background-size:22px 22px}
.lock-panel{width:100%;max-width:400px;padding:26px 26px 22px}
.lock-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lock-brand .brand-mark{width:46px;height:46px;flex-basis:46px}
.lock-brand .brand-name{font-size:24px}
.lock-tip{font-size:12.5px;color:var(--ink-2);margin-bottom:12px;letter-spacing:.04em}
.lock-hint{margin-top:12px;font-size:11.5px;color:var(--ink-3);text-align:center;letter-spacing:.05em}

/* ===== Toast ===== */
.toast-root{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
.toast{
  display:flex;align-items:flex-start;gap:9px;width:100%;padding:11px 14px;border-radius:2px;font-size:13px;
  background:var(--ink);color:var(--surface);box-shadow:0 10px 30px rgba(33,43,60,.28);border-left:3px solid var(--verm);
  animation:toastIn .18s ease;letter-spacing:.02em;
}
.toast svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.toast.ok{border-left-color:var(--teal)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 权限拦截页 ===== */
.deny{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;text-align:center}
.deny svg{width:46px;height:46px;color:var(--ink-3)}
.deny h2{font-family:var(--serif);font-size:19px}
.deny p{font-size:13px;color:var(--ink-2)}

/* ===== 响应式 ===== */
@media (min-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:238px;transform:none;z-index:70}
  .main{margin-left:238px}
  .menu-btn{display:none}
  .view{padding:20px 22px 64px}
  .topbar{padding:10px 18px}
  .user-meta{display:block}
  .searchbox{display:block}
  .user-chip{padding-right:10px;border-color:var(--line)}
  .kpi-num{font-size:25px}
  .crumb{font-size:14px}
  /* 侧边栏折叠：收为图标窄栏 */
  .app.side-collapsed .sidebar{width:64px}
  .app.side-collapsed .main{margin-left:64px}
  .app.side-collapsed .brand{justify-content:center;padding:18px 12px 14px;gap:0}
  .app.side-collapsed .brand-txt,
  .app.side-collapsed .fold-ind,
  .app.side-collapsed .nav-label,
  .app.side-collapsed .nav-item > span:not(.nav-ic),
  .app.side-collapsed .side-user{display:none}
  .app.side-collapsed .nav{padding:12px 7px;align-items:stretch}
  .app.side-collapsed .nav-item{justify-content:center;padding:10px 0}
  .app.side-collapsed .nav-item.active::before{left:-7px;right:auto}
}
@media (min-width:1200px){
  .view{padding:24px 30px 64px}
}

/* ===== 打印 ===== */
@media print{
  .sidebar,.topbar,.tabs,.toolbar,.page-actions,.toast-root,.btn,.dropdown-root,.modal-root{display:none!important}
  .view{padding:0}
  .card{box-shadow:none;border:none}
  body{background:#fff}
  .tbl{min-width:0}
}

/* ===== 移动端输入控件 ≥ 16px（避免 iOS 聚焦缩放） ===== */
@media (max-width:640px){
  input,select,textarea{font-size:16px}
  .field input,.field select,.field textarea{font-size:16px}
  .searchbox input{font-size:16px}
  .toolbar input[type=search],.toolbar select{font-size:16px}
  .line-row input,.line-row select{font-size:16px}
  .lock-acc{font-size:14px}
}

</style>
</head>
<body>

<!-- ===== 登录 / 账号切换 ===== -->
<div id="lockScreen" class="lock hidden" aria-hidden="true">

<!-- ===== 应用外壳 ===== -->
<div id="app" class="app hidden">

</div>

<div id="bellRoot" class="dropdown-root"></div>

<!-- 弹层 / 轻提示 -->
<div id="modalRoot" class="modal-root"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<script>
/* ============================================================
   账房 ERP · 数据层与业务逻辑
   ============================================================ */
'use strict';

var LS_KEY = 'zf_erp_v1';
var SS_KEY = 'zf_erp_session';
var RESET_MARK_KEY = 'zf_erp_reset_v113';
var S = null;                 // 全局状态
var MODULES = [
  { key:'dash', label:'仪表盘',     icon:'dash', num:'01' },
  { key:'crm',  label:'客户管理',   icon:'crm',  num:'02' },
  { key:'prd',  label:'产品管理',   icon:'prd',  num:'03' },
  { key:'sale', label:'销售订单',   icon:'sale', num:'04' },
  { key:'sup',  label:'供应商',     icon:'sup',  num:'05' },
  { key:'pur',  label:'采购单',     icon:'pur',  num:'06' },
  { key:'ib',   label:'入库单',     icon:'ib',   num:'07' },
  { key:'ob',   label:'出库单',     icon:'ob',   num:'08' },
  { key:'inv',  label:'库存管理',   icon:'inv',  num:'09' },
  { key:'fin',  label:'财务对账',   icon:'fin',  num:'10' },
  { key:'acct', label:'账号管控',   icon:'acct', num:'11' },
  { key:'logs', label:'操作日志',   icon:'log',  num:'12' },
  { key:'set',  label:'系统设置',   icon:'set',  num:'13' }
];
var ROLE_DEFS = [
  { key:'admin',     name:'管理员',     desc:'内置管理员，全部权限，不可修改' },
  { key:'sales',     name:'销售专员',   desc:'维护客户与销售订单，查看出入库与财务' },
  { key:'purchase',  name:'采购专员',   desc:'维护供应商与采购、入库单据' },
  { key:'warehouse', name:'仓库管理员', desc:'办理出入库、库存盘点与调整' },
  { key:'finance',   name:'财务专员',   desc:'登记收付款、处理对账报表' },
  { key:'viewer',    name:'访客',       desc:'只读查看业务数据，不可操作' }
];
var PAY_METHODS = ['银行转账','现金','支付宝','微信','承兑汇票'];
var CAT_COLORS = ['verm','teal','amber','blue','ink'];

/* ---------- 格式化 ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){
  var x = (d instanceof Date) ? d : new Date(String(d).replace(/-/g,'/'));
  if (isNaN(x.getTime())) return d;
  return x.getFullYear() + '-' + pad2(x.getMonth()+1) + '-' + pad2(x.getDate());
}
function fmtDateTime(d){
  var x = (d instanceof Date) ? d : new Date(String(d).replace(/-/g,'/'));
  if (isNaN(x.getTime())) return String(d);
  return fmtDate(x) + ' ' + pad2(x.getHours()) + ':' + pad2(x.getMinutes());
}
function todayStr(){ return fmtDate(new Date()); }
function addDays(offset){ var d = new Date(); d.setDate(d.getDate()+offset); return d; }
function dayStr(offset){ return fmtDate(addDays(offset)); }
function monthStr(){ var n = new Date(); return n.getFullYear() + '-' + pad2(n.getMonth()+1); }
function fmtMoney(n){
  n = Number(n) || 0;
  return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtQty(n){
  var v = Number(n) || 0;

}
function calcAmt(qty, price){ return Math.round(Number(qty)*Number(price)*100)/100; }

function saveState(){

}
function getSession(){
  try {
    var raw = localStorage.getItem(SS_KEY);
    if (raw) { var s = JSON.parse(raw); if (S.users.some(function(u){ return u.id===s.uid; })) return s; }
  } catch(e){}
  return { uid:'u-admin' };
}
function setSession(uid){
  localStorage.setItem(SS_KEY, JSON.stringify({ uid: uid }));
}
function currentUser(){
  var s = getSession();
  for (var i=0;i<S.users.length;i++) if (S.users[i].id===s.uid) return S.users[i];
  return S.users[0];
}
function curRoleKey(){ return currentUser().role; }
function canView(key){
  var r = S.roles[curRoleKey()];
  if (!r) return true;
  var p = r.perms && r.perms[key];
  if (!p) return true;   /* 老数据兼容：旧版本账号数据未配置新模块权限时，默认可见 */
  return !!p.v;
}
function canOp(key){
  var r = S.roles[curRoleKey()];
  if (!r) return false;
  var p = r.perms && r.perms[key];
  if (!p) return false;  /* 未配置权限默认不可操作，避免越权 */
  return !!p.o;
}
function visibleModules(){
  return MODULES.filter(function(m){ return canView(m.key); });
}
/* 权限迁移：老数据中的角色缺少新版本新增模块权限时自动补全；操作日志仅管理员可见（每次加载强制校正，覆盖旧数据已补的宽泛权限） */
function migrateState(){
  if (!S || !S.roles) return;
  MODULES.forEach(function(m){
    Object.keys(S.roles).forEach(function(rk){
      var r = S.roles[rk];
      if (!r) return;
      if (!r.perms) r.perms = {};
      var isAdmin = (rk === 'admin');
      if (m.key === 'logs'){
        r.perms.logs = isAdmin ? { v:1, o:1 } : { v:0, o:0 };
        return;
      }
      if (!r.perms[m.key]) r.perms[m.key] = isAdmin ? { v:1, o:1 } : { v:1, o:0 };
    });
  });
}

    stockLedger: stockLedger, payments: payments,
    users: users, roles: roles,
    settings: { lowStock:10, taxRate:13, currency:'¥', decimals:2 }
  };
}

/* 空白初始状态：保留账号体系 / 角色权限 / 公司信息 / 业务参数，业务数据全部为空 */
function buildBlank(){
  var seed = buildSeed();
  seed.meta = { version:1, initAt: todayStr() };
  seed.seq = { crm:1, sup:1, prd:1, so:1, po:1, ib:1, ob:1, pay:1, adj:1 };
  seed.categories = [];
  seed.products = [];
  seed.customers = [];
  seed.suppliers = [];
  seed.salesOrders = [];
  seed.purchaseOrders = [];
  seed.inboundDocs = [];
  seed.outboundDocs = [];
  seed.stockLedger = [];
  seed.payments = [];
  return seed;
}
/* 清空全部业务数据（保留账号与系统配置），会话回到管理员 */
function resetToBlank(){
  S = buildBlank();
  saveState();
  try { localStorage.removeItem(SS_KEY); } catch(e){}
  setSession('u-admin');
  return S;
}
function initStore(){
  var raw = null, mark = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  try { mark = localStorage.getItem(RESET_MARK_KEY); } catch(e){}
  if (raw) {
    try {
      var obj = JSON.parse(raw);
      if (obj && obj.meta && obj.meta.version===1 && obj.users && obj.roles) {
        /* v1.1.3 起默认空白初始：对旧版遗留数据执行一次性清空 */
        if (!mark) {
          S = buildBlank();
          saveState();
          try { localStorage.setItem(RESET_MARK_KEY, '1'); } catch(e){}
          window.__erpAutoReset = true;
        } else { S = obj; migrateState(); }
        return;
      }
    } catch(e){}
  }
  S = buildBlank();
  saveState();
  try { localStorage.setItem(RESET_MARK_KEY, '1'); } catch(e){}
}

/* ---------- 通用 CRUD ---------- */
function addItem(list, item){ list.push(item); saveState(); }
function updateItem(list, id, patch){ for (var i=0;i<list.length;i++) if (list[i].id===id){ Object.assign(list[i], patch); saveState(); return list[i]; } return null; }
function removeItem(list, id){ for (var i=0;i<list.length;i++) if (list[i].id===id){ list.splice(i,1); saveState(); return true; } return false; }
function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id===id) return list[i]; return null; }
function nextSeq(key){ S.seq[key] = (S.seq[key]||0) + 1; return S.seq[key]; }
function catName(id){ var c = byId(S.categories, id); return c ? c.name : '—'; }
function prodName(pid){ var p = byId(S.products, pid); return p ? p.name : '已删除产品'; }
function partnerName(type, id){
  if (type==='crm'){ var c=byId(S.customers,id); return c?c.name:'—'; }
  var s = byId(S.suppliers, id); return s ? s.name : '—';
}
function roleName(key){ var r = S.roles[key]; return r ? r.name : key; }

/* ---------- 单据状态推导（销售 / 采购） ---------- */
function shippedQtyOf(soId, pid){
  var q = 0;
  S.outboundDocs.forEach(function(d){ if (d.type==='sales' && d.refId===soId){ d.lines.forEach(function(l){ if (l.pid===pid) q += l.qty; }); } });
  return q;
}
function receivedQtyOf(poId, pid){
  var q = 0;
  S.inboundDocs.forEach(function(d){ if (d.type==='purchase' && d.refId===poId){ d.lines.forEach(function(l){ if (l.pid===pid) q += l.qty; }); } });
  return q;
}
function soStatus(so){
  if (so.closed) return 'canceled';
  if (so.done) return 'done';
  var all = true, any = false;
  so.lines.forEach(function(l){
    var s = shippedQtyOf(so.id, l.pid);
    if (s >= l.qty) { any = true; } else { all = false; if (s>0) any = true; }
  });
  if (all && any) return 'shipped';
  if (any) return 'partial';
  if (so.audited) return 'audited';
  return 'pending';
}
function poStatus(po){
  if (po.closed) return 'canceled';
  if (po.done) return 'done';
  var all = true, any = false;
  po.lines.forEach(function(l){
    var r = receivedQtyOf(po.id, l.pid);
    if (r >= l.qty) { any = true; } else { all = false; if (r>0) any = true; }
  });
  if (all && any) return 'received';
  if (any) return 'partial';
  if (po.audited) return 'audited';
  return 'pending';
}
var STATUS_META = {
  pending:   { label:'待审核', cls:'st-amber' },
  audited:   { label:'已审核', cls:'st-ink' },
  partial:   { label:'部分出库', cls:'st-blue' },
  shipped:   { label:'已出库', cls:'st-verm' },
  received:  { label:'已入库', cls:'st-teal' },
  done:      { label:'已完成', cls:'st-teal' },
  canceled:  { label:'已取消', cls:'st-gray' }
};

/* ---------- 订单动作 ---------- */
function soAudit(so){ if (!canOp('sale')) return '无权操作'; if (so.audited || so.closed) return '当前状态不可审核'; so.audited = true; saveState(); return ''; }
function poAudit(po){ if (!canOp('pur')) return '无权操作'; if (po.audited || po.closed) return '当前状态不可审核'; po.audited = true; saveState(); return ''; }
function soCancel(so){ if (!canOp('sale')) return '无权操作'; var st = soStatus(so); if (st!=='pending' && st!=='audited') return '仅待审核/已审核可取消'; so.closed = true; saveState(); return ''; }
function poCancel(po){ if (!canOp('pur')) return '无权操作'; var st = poStatus(po); if (st!=='pending' && st!=='audited') return '仅待审核/已审核可取消'; po.closed = true; saveState(); return ''; }
function soDone(so){ if (!canOp('sale')) return '无权操作'; var st = soStatus(so); if (st==='shipped'){ so.done = true; saveState(); return ''; } return '仅已出库状态可完成'; }
function poDone(po){ if (!canOp('pur')) return '无权操作'; var st = poStatus(po); if (st==='received'){ po.done = true; saveState(); return ''; } return '仅已入库状态可完成'; }

/* ---------- 收付款 ---------- */
function paidOf(refType, refId){
  var t = 0;
  S.payments.forEach(function(p){ if (p.refType===refType && p.refId===refId && p.type==='in') t += p.amount; });
  return Math.round(t*100)/100;
}
function paidOutOf(refType, refId){
  var t = 0;
  S.payments.forEach(function(p){ if (p.refType===refType && p.refId===refId && p.type==='out') t += p.amount; });
  return Math.round(t*100)/100;
}
function crmFin(custId){
  var total=0, paid=0, orders=[];
  S.payments.forEach(function(p){ if (p.type==='in' && p.partnerType==='crm' && p.partnerId===custId) paid += p.amount; });
  S.salesOrders.forEach(function(so){
    if (so.custId!==custId) return;
    var st = soStatus(so);
    if (st==='canceled') return;
    var p = paidOf('so', so.id);
    total += so.total;
    orders.push({ ref:so, status:st, paid:p, unpaid:Math.round((so.total-p)*100)/100 });
  });
  return { total:Math.round(total*100)/100, paid:Math.round(paid*100)/100, unpaid:Math.round((total-paid)*100)/100, orders:orders };
}
function supFin(supId){
  var total=0, paid=0, orders=[];
  S.payments.forEach(function(p){ if (p.type==='out' && p.partnerType==='sup' && p.partnerId===supId) paid += p.amount; });
  S.purchaseOrders.forEach(function(po){
    if (po.supId!==supId) return;
    var st = poStatus(po);
    if (st==='canceled') return;
    var p = paidOutOf('po', po.id);
    total += po.total;
    orders.push({ ref:po, status:st, paid:p, unpaid:Math.round((po.total-p)*100)/100 });
  });
  return { total:Math.round(total*100)/100, paid:Math.round(paid*100)/100, unpaid:Math.round((total-paid)*100)/100, orders:orders };
}
function registerPayment(data){
  if (!canOp('fin')) return '无权操作';
  if (!(data.amount>0)) return '金额必须大于 0';
  if (data.type==='in'){
    var f = crmFin(data.partnerId);
    if (data.amount > f.unpaid + 1e-6) return '收款金额超过该客户未收余额';
  } else {
    var g = supFin(data.partnerId);
    if (data.amount > g.unpaid + 1e-6) return '付款金额超过该供应商未付余额';
  }
  S.payments.push({
    id:'PAY'+nextSeq('pay'), date:data.date||todayStr(), type:data.type,
    partnerType:data.partnerType, partnerId:data.partnerId,
    refType:data.refType||'', refId:data.refId||'',
    amount:Math.round(data.amount*100)/100, method:data.method, note:data.note||''
  });
  saveState();
  return '';
}

/* ---------- 库存：入库 / 出库 / 盘点 ---------- */
function applyStock(doc){
  /* doc: {type:'IB'|'OB' 或业务类型 purchase/sales/other, dir:'in'|'out', date, no, lines:[{pid,qty}], note, operator, docTypeLabel} */
  var dir = doc.dir === 'in' ? 1 : (doc.dir === 'out' ? -1 : (doc.type === 'IB' ? 1 : -1));
  if (dir < 0){
    var short = [];
    doc.lines.forEach(function(l){
      var p = byId(S.products, l.pid);
      if (!p || p.stock < l.qty) short.push((p?p.name:'未知') + '（现有 ' + fmtQty(p?p.stock:0) + '，需 ' + fmtQty(l.qty) + '）');
    });
    if (short.length) return '库存不足：' + short.join('；');
  }
  doc.lines.forEach(function(l){
    var p = byId(S.products, l.pid);
    if (!p) return;
    var q = dir * l.qty;
    p.stock = Math.round((p.stock + q)*1000)/1000;
    var last = null;
    for (var i=S.stockLedger.length-1;i>=0;i--){ if (S.stockLedger[i].pid===l.pid){ last = S.stockLedger[i]; break; } }
    var bal = (last ? last.balance : 0) + q;
    S.stockLedger.push({ date:doc.date, docType:doc.docTypeLabel, docNo:doc.no, pid:l.pid, qty:q, balance:Math.round(bal*1000)/1000, note:doc.note||'' });
  });
  saveState();
  return '';
}
function createInbound(data){
  if (!canOp('ib')) return '无权操作';
  if (!data.lines.length) return '请至少添加一行入库明细';
  var no = 'RK' + data.date.replace(/-/g,'') + pad2(nextSeq('ib'));
  var doc = { id:'IB'+String(S.seq.ib).padStart(3,'0'), no:no, date:data.date, type:data.type, refId:data.refId||'', operator:data.operator||'', lines:data.lines, note:data.note||'', dir:'in', docTypeLabel: data.type==='purchase' ? '采购入库' : '其他入库' };
  var err = applyStock(doc);
  if (err) return err;
  S.inboundDocs.push(doc);
  if (doc.type==='purchase' && data.refId){
    var po = byId(S.purchaseOrders, data.refId);
    if (po){ var st = poStatus(po); if (st==='received') po.done = true; }
  }
  saveState();
  return '';
}
function createOutbound(data){
  if (!canOp('ob')) return '无权操作';
  if (!data.lines.length) return '请至少添加一行出库明细';
  var no = 'CK' + data.date.replace(/-/g,'') + pad2(nextSeq('ob'));
  var doc = { id:'OB'+String(S.seq.ob).padStart(3,'0'), no:no, date:data.date, type:data.type, refId:data.refId||'', operator:data.operator||'', lines:data.lines, note:data.note||'', dir:'out', docTypeLabel: data.type==='sales' ? '销售出库' : '其他出库' };
  var err = applyStock(doc);
  if (err) return err;
  S.outboundDocs.push(doc);
  if (doc.type==='sales' && data.refId){
    var so = byId(S.salesOrders, data.refId);
    if (so){ var st = soStatus(so); if (st==='shipped') so.done = true; }
  }
  saveState();
  return '';
}
function adjustStock(pid, qty, note){
  if (!canOp('inv')) return '无权操作';
  var p = byId(S.products, pid);
  if (!p) return '产品不存在';
  qty = Number(qty) || 0;
  if (qty===0) return '调整数量不能为 0';
  p.stock = Math.round((p.stock + qty)*1000)/1000;
  var last = null;
  for (var i=S.stockLedger.length-1;i>=0;i--){ if (S.stockLedger[i].pid===pid){ last = S.stockLedger[i]; break; } }
  var bal = (last ? last.balance : 0) + qty;
  S.stockLedger.push({ date:todayStr(), docType:'盘点调整', docNo:'TZ'+pad2(nextSeq('adj')), pid:pid, qty:qty, balance:Math.round(bal*1000)/1000, note:note||'人工盘点' });
  saveState();
  return '';
}

/* ---------- 仪表盘统计 ---------- */
function monthSales(){ var m=monthStr(), t=0; S.salesOrders.forEach(function(o){ if (o.date.slice(0,7)===m && soStatus(o)!=='canceled') t+=o.total; }); return Math.round(t*100)/100; }
function monthPurchase(){ var m=monthStr(), t=0; S.purchaseOrders.forEach(function(o){ if (o.date.slice(0,7)===m && poStatus(o)!=='canceled') t+=o.total; }); return Math.round(t*100)/100; }
function todaySales(){ var d=todayStr(), t=0; S.salesOrders.forEach(function(o){ if (o.date===d && soStatus(o)!=='canceled') t+=o.total; }); return Math.round(t*100)/100; }
function stockValue(){ var t=0; S.products.forEach(function(p){ t+=p.stock*p.cost; }); return Math.round(t*100)/100; }
function lowStockList(){ return S.products.filter(function(p){ return p.status===1 && p.stock < p.safety; }); }
function receivablesTotal(){ var t=0; S.customers.forEach(function(c){ t+=crmFin(c.id).unpaid; }); return Math.round(t*100)/100; }
function payablesTotal(){ var t=0; S.suppliers.forEach(function(s){ t+=supFin(s.id).unpaid; }); return Math.round(t*100)/100; }
function pendingCounts(){
  var so=0, po=0;
  S.salesOrders.forEach(function(o){ if (soStatus(o)==='pending') so++; });
  S.purchaseOrders.forEach(function(o){ if (poStatus(o)==='pending') po++; });
  return { so:so, po:po };
}
/* 待办列表（供铃铛面板与仪表盘待办共用口径）：待审核销售订单 → 待审核采购单 → 库存告急 */
function todoList(){
  var rows = [];
  S.salesOrders.forEach(function(o){
    if (soStatus(o)==='pending') rows.push({ grp:'sale', icon:'sale', cls:'amber', title:o.no, meta: partnerName('crm',o.custId) + ' · ' + fmtMoney(o.total), go:'#/sale/view?id=' + o.id });
  });
  S.purchaseOrders.forEach(function(o){
    if (poStatus(o)==='pending') rows.push({ grp:'pur', icon:'pur', cls:'teal', title:o.no, meta: partnerName('sup',o.supId) + ' · ' + fmtMoney(o.total), go:'#/pur/view?id=' + o.id });
  });
  lowStockList().forEach(function(p){
    rows.push({ grp:'alert', icon:'alert', cls:'verm', title:p.name, meta:'现存量 ' + fmtQty(p.stock) + '，低于安全库存 ' + fmtQty(p.safety), go:'#/inv?t=overview&low=1' });
  });
  return rows;
}
function todoTotal(){ return todoList().length; }
function weekSeries(weeks){
  /* 返回 {labels, sales[], purchases[]}，weeks 为周起始日期数组 */
  var out = { labels:[], sales:[], purchases:[] };
  weeks.forEach(function(w){
    out.labels.push(w.slice(5));
    var s=0, p=0;
    S.salesOrders.forEach(function(o){ if (o.date>=w && o.date<nextWeek(w) && soStatus(o)!=='canceled') s+=o.total; });
    S.purchaseOrders.forEach(function(o){ if (o.date>=w && o.date<nextWeek(w) && poStatus(o)!=='canceled') p+=o.total; });
    out.sales.push(Math.round(s)); out.purchases.push(Math.round(p));
  });
  return out;
}
function nextWeek(w){ var d=new Date(w+'T00:00:00'); d.setDate(d.getDate()+7); return fmtDate(d); }
function lastWeeks(n){
  var arr=[], d=new Date(); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  for (var i=n-1;i>=0;i--){ var x=new Date(d); x.setDate(x.getDate()-7*i); arr.push(fmtDate(x)); }
  return arr;
}
function catStockValue(){
  var map={};
  S.products.forEach(function(p){ var c=catName(p.cat); map[c]=(map[c]||0)+p.stock*p.cost; });
  var arr=[];
  for (var k in map) arr.push({ name:k, value:Math.round(map[k]) });
  arr.sort(function(a,b){ return b.value-a.value; });
  return arr.slice(0,8);
}
function pay7days(){
  var arr=[], d=new Date();
  for (var i=6;i>=0;i--){ var x=new Date(d); x.setDate(x.getDate()-i); arr.push(fmtDate(x)); }
  var out={ labels:[], in:[], out:[] };
  arr.forEach(function(dt){
    out.labels.push(dt.slice(5));
    var a=0, b=0;
    S.payments.forEach(function(p){ if (p.date===dt){ if (p.type==='in') a+=p.amount; else b+=p.amount; } });
    out.in.push(Math.round(a)); out.out.push(Math.round(b));
  });
  return out;
}

/* ---------- 导出 CSV ---------- */
function exportCSV(filename, rows){
  if (!rows.length) return;
  var esc = function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; };
  var csv = rows.map(function(r){ return r.map(esc).join(','); }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 300);
}

/* ---------- 备份 / 恢复 / 重置 ---------- */
function backupData(){
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '账房ERP备份-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 300);
}
function restoreData(text){
  try {
    var obj = JSON.parse(text);
    if (!(obj && obj.meta && obj.meta.version===1 && obj.users && obj.roles)) return '备份文件格式不正确';
    S = obj; saveState();
    migrateState();           /* 恢复后校正新模块权限（如操作日志仅管理员），兼容旧版备份 */
    saveState();
    try { CUR_SESSION = null; sessionStorage.removeItem('zf_erp_cur_session'); } catch(e){}
    ensureSession();          /* 重建当前登录会话，保证恢复后的操作日志仍可归属会话 */
    return '';
  } catch(e){ return '无法解析备份文件'; }
}
function resetData(){
  S = buildSeed(); saveState();
}

/* ---------- 通知中心 ---------- */
var NOTES = [];
var NOTES_KEY = 'zf_erp_notes';
function loadNotes(){

    var raw = localStorage.getItem(NOTES_KEY);
    NOTES = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(NOTES)) NOTES = [];
  } catch(e){ NOTES = []; }
}
function saveNotes(){
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES.slice(0,120))); } catch(e){}
}
function pushNote(type, title, sub, go){
  NOTES.unshift({ id:'N' + Date.now() + '_' + Math.floor(Math.random()*1000), type:type, title:title, sub:sub||'', go:go||'', ts:Date.now(), read:false });
  if (NOTES.length > 120) NOTES.length = 120;
  saveNotes();

function unreadNotes(){
  return NOTES.filter(function(n){ return !n.read; });
}
function markAllNotesRead(){
  NOTES.forEach(function(n){ n.read = true; });
  saveNotes();
}
function noteTime(ts){
  var d = new Date(ts), now = new Date();
  var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  var y = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var days = Math.round((y - dd) / 86400000);
  if (days === 0) return '今天 ' + hm;
  if (days === 1) return '昨天 ' + hm;
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

/* ---------- 登录日志 / 操作日志（按登录会话聚合） ---------- */
var LOGS_KEY = 'zf_erp_logs';
var LOGIN_LOGS = [];
var OP_LOGS = [];
var CUR_SESSION = null;   /* 当前登录会话 */
function loadLogs(){
  try {
    var raw = localStorage.getItem(LOGS_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      LOGIN_LOGS = Array.isArray(d.login) ? d.login : [];
      OP_LOGS = Array.isArray(d.op) ? d.op : [];
    }
  } catch(e){ LOGIN_LOGS = []; OP_LOGS = []; }
}
function saveLogs(){
  try { localStorage.setItem(LOGS_KEY, JSON.stringify({ login: LOGIN_LOGS, op: OP_LOGS })); } catch(e){}
}
function logWho(){
  var u = (typeof currentUser === 'function') ? currentUser() : null;
  return { account: u ? u.username : '-', name: u ? u.name : '-' };
}
/* 建立一条登录会话：每次登录（含账号切换）生成一条登录日志，会话内的操作挂靠该会话 */
function newSession(action, detail){
  var w = logWho();
  var id = 's' + Date.now().toString(36) + '_' + Math.floor(Math.random()*10000);
  CUR_SESSION = { id:id, account:w.account, name:w.name };
  LOGIN_LOGS.unshift({ session:id, ts:Date.now(), account:w.account, name:w.name, action:action || '登录系统', detail:detail || '登录成功' });
  if (LOGIN_LOGS.length > 300) LOGIN_LOGS.length = 300;
  saveLogs();
  try { sessionStorage.setItem('zf_erp_cur_session', JSON.stringify(CUR_SESSION)); } catch(e){}
  return CUR_SESSION;
}
/* 页面首次进入时建立登录会话（同一浏览器标签页刷新复用，不重复计登录） */
function ensureSession(){
  if (CUR_SESSION) return CUR_SESSION;
  try {
    var raw = sessionStorage.getItem('zf_erp_cur_session');
    if (raw){ var s = JSON.parse(raw); if (s && s.id && s.account){ CUR_SESSION = s; return s; } }
  } catch(e){}
  return newSession('登录系统', '登录成功');
}
function pushLoginLog(action, detail){
  return newSession(action, detail);
}
function pushOpLog(action, detail){
  var w = logWho();
  var sid = CUR_SESSION ? CUR_SESSION.id : null;
  if (!sid){ var s = ensureSession(); sid = s ? s.id : null; }
  OP_LOGS.unshift({ session:sid, ts:Date.now(), account:w.account, name:w.name, action:action, detail:detail || '' });
  if (OP_LOGS.length > 500) OP_LOGS.length = 500;
  saveLogs();
}
/* 某条登录日志对应的会话操作记录：优先按会话 id 精确匹配；老数据（无 session 字段）按「该次登录后、同账号下次登录前」时间窗口归集 */
function sessionOps(item, idx){
  if (item.session) return OP_LOGS.filter(function(o){ return o.session === item.session; });
  var acc = item.account;
  var next = null;
  for (var j = idx + 1; j < LOGIN_LOGS.length; j++){
    if (LOGIN_LOGS[j].account === acc){ next = LOGIN_LOGS[j]; break; }
  }
  var t0 = item.ts || 0, t1 = next ? (next.ts || Infinity) : Infinity;
  return OP_LOGS.filter(function(o){ return o.account === acc && o.ts >= t0 && o.ts < t1; });
}
function logTime(ts){
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '-';
  var p = function(n){ return ('0'+n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function clearLogs(){

}

UI.dropdown = function(anchor, items, opts){
  var root = document.getElementById('dropdownRoot');
  root.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'dropdown';
  panel.style.position = 'absolute';
  if (items.length){
    panel.innerHTML = items.map(function(it, i){
      if (it.head) return '<div class="dd-head">' + it.title + '</div>';
      return '<div class="dd-item" data-i="' + i + '">' +
        (it.icon ? '<span class="ic">' + UI.icon(it.icon,14) + '</span>' : '') +
        '<span class="dd-main"><span class="dd-t">' + it.title + '</span>' + (it.sub ? '<span class="dd-s">' + it.sub + '</span>' : '') + '</span>' +
        (it.right || '') + '</div>';
    }).join('');
    panel.querySelectorAll('.dd-item').forEach(function(di){
      di.addEventListener('click', function(){
        close();
        var fn = items[Number(di.getAttribute('data-i'))];
        if (fn && fn.onClick) fn.onClick();
      });
    });
  } else {
    panel.innerHTML = '<div class="dd-empty">' + (opts && opts.empty || '暂无内容') + '</div>';
  }
  root.appendChild(panel);
  var r = anchor.getBoundingClientRect();
  var pRect = panel.getBoundingClientRect();
  var left = r.left;
  var top = r.bottom + 6;
  if (left + pRect.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pRect.width - 8);
  if (top + pRect.height > window.innerHeight - 8) top = Math.max(8, r.top - pRect.height - 6);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  function close(){ if (root.firstChild === panel) root.innerHTML = ''; document.removeEventListener('click', onDoc, true); }
  function onDoc(ev){ if (root.firstChild !== panel) return; if (!panel.contains(ev.target) && !anchor.contains(ev.target)) close(); }
  setTimeout(function(){ document.addEventListener('click', onDoc, true); }, 10);
  return { close: close, el: panel };
};

/* ================= 客户管理 ================= */
function escA(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* 行政区简称：广西壮族自治区→广西、北京市→北京、玉州区→玉州 */
function alName(x){
  return String(x).replace(/壮族自治区|维吾尔自治区|回族自治区|特别行政区|自治区|自治州|自治县|省|市|地区|盟|区|县|旗/g, '');
}
/* 按全称或简称匹配地址前缀 */
function matchSeg(addr, keys){
  for (var i=0;i<keys.length;i++){
    var k = keys[i];
    if (addr.indexOf(k) === 0) return { v:k, rest:addr.slice(k.length) };
    var a = alName(k);
    if (a && a.length >= 2 && a !== k && addr.indexOf(a) === 0) return { v:k, rest:addr.slice(a.length) };
  }
  return null;
}
function cleanSeg(rest){
  rest = String(rest||'').replace(/^\s+/, '');
  return rest.replace(/^(省|市|自治区|特别行政区|自治州|地区|盟|区|县|旗)/, '');
}
/* 把完整地址串拆分回 省 / 市 / 区县 / 具体地址 */
function splitAddress(addr){
  var out = { prov:'', city:'', dist:'', detail: addr || '' };
  if (!addr) return out;
  var m1 = matchSeg(addr, Object.keys(REGION_DATA));
  if (!m1) return out;
  out.prov = m1.v;
  var m2 = matchSeg(cleanSeg(m1.rest), REGION_DATA[m1.v] ? Object.keys(REGION_DATA[m1.v]) : []);
  if (!m2){ out.detail = m1.rest; return out; }
  out.city = m2.v;
  var m3 = matchSeg(cleanSeg(m2.rest), REGION_DATA[m1.v][m2.v] || []);
  if (m3){ out.dist = m3.v; out.detail = cleanSeg(m3.rest); }
  else out.detail = m2.rest;
  return out;
}

              var p = byId(S.products, inp.value);
              if (p){ var q = rowEl.querySelector('[data-k="qty"]'); var pr = rowEl.querySelector('[data-k="price"]');
                if (!q.value || Number(q.value)<=0) q.value = 1;
                if (lockPrice) pr.value = p.price;
                else if (!pr.value || Number(pr.value)<=0) pr.value = p.price;
              }
            }
            sync(i);
          });
        });
        rowEl.querySelector('[data-act="rm"]').addEventListener('click', function(){
          rows.splice(i, 1); render(); if (opts.onChange) opts.onChange(total());
        });
        rowEl.querySelector('[data-act="rm"]').innerHTML = UI.icon('x',15);
      });
    }
    if (opts.onChange) opts.onChange(total());
  }
  function sync(i){
    var rowEl = container.querySelector('.line-row[data-i="' + i + '"]');
    if (!rowEl) return;
    var pid = rowEl.querySelector('[data-k="pid"]').value;
    var qty = Number(rowEl.querySelector('[data-k="qty"]').value) || 0;
    var price = Number(rowEl.querySelector('[data-k="price"]').value) || 0;
    rows[i].pid = pid; rows[i].qty = qty; rows[i].price = price;
    rowEl.querySelector('[data-k="amt"]').textContent = fmtMoney(calcAmt(qty, price));
    var sumEl = container.querySelector('.line-sum b');
    if (sumEl) sumEl.textContent = fmtMoney(total());
    if (opts.onChange) opts.onChange(total());
  }
  function total(){
    return rows.reduce(function(s, r){ return s + calcAmt(r.qty, r.price); }, 0);
  }
  render();
  return { add: function(){ rows.push({ pid:'', qty:1, price:0 }); render(); }, redraw: render, rows: rows, total: total };
}
function orderLinesValid(rows){
  if (!rows.length) return '请至少添加一行明细';
  for (var i=0;i<rows.length;i++){
    if (!rows[i].pid) return '第 ' + (i+1) + ' 行未选择产品';
    if (!(rows[i].qty > 0)) return '第 ' + (i+1) + ' 行数量必须大于 0';
    if (rows[i].price < 0) return '第 ' + (i+1) + ' 行单价不能为负数';
  }
  return '';
}

function soAction(so, fn, okTitle, okMsg){
  UI.confirm(okTitle, '确定对订单 ' + so.no + ' 执行此操作？').then(function(yes){
    if (!yes) return;
    var err = fn(so);
    if (err) { UI.toast(err, 'err'); return; }
    if (okTitle === '审核通过') pushNote('sale', '销售订单已审核', so.no + ' 审核通过，可安排出库', '#/sale/view?id=' + so.id);
    else if (okTitle === '订单完成') pushNote('sale', '订单已完成', so.no + ' 已归档完成', '#/sale/view?id=' + so.id);
    pushOpLog(okTitle, '销售订单 ' + so.no + ' ' + okMsg);
    UI.toast(okMsg, 'ok');
    renderRoute();
  });
}
function soCancelAction(so){
  UI.confirm('取消订单', '确定取消订单 ' + so.no + '？取消后不可恢复。', true).then(function(yes){

function poAction(po, fn, okTitle, okMsg){
  UI.confirm(okTitle, '确定对采购单 ' + po.no + ' 执行此操作？').then(function(yes){
    if (!yes) return;
    var err = fn(po);
    if (err) { UI.toast(err, 'err'); return; }
    if (okTitle === '审核通过') pushNote('pur', '采购单已审核', po.no + ' 审核通过，可安排入库', '#/pur/view?id=' + po.id);
    else if (okTitle === '采购完成') pushNote('pur', '采购已完成', po.no + ' 已归档完成', '#/pur/view?id=' + po.id);
    pushOpLog(okTitle, '采购单 ' + po.no + ' ' + okMsg);
    UI.toast(okMsg, 'ok');
    renderRoute();
  });
}
function poCancelAction(po){
  UI.confirm('取消采购单', '确定取消采购单 ' + po.no + '？取消后不可恢复。', true).then(function(yes){
    if (!yes) return;
    var err = poCancel(po);
    if (err) { UI.toast(err, 'err'); return; }
    pushNote('pur', '采购单已取消', po.no + ' 已取消', '#/pur?f=canceled');
    pushOpLog('取消采购单', po.no + ' 已取消');
    UI.toast('采购单已取消', 'ok');
    renderRoute();
  });
}
function createPO(){
  if (!canOp('pur')) { UI.toast('当前账号无此操作权限','err'); return; }
  var rows = [{ pid:'', qty:1, price:0 }];
  var m = UI.modal({
    title:'新建采购单', wide:true,
    body: '<div class="form two" style="margin-bottom:14px">' +
      '<div class="field"><label><span class="req">*</span>供应商</label><select id="poSup"><option value="">选择供应商</option>' + S.suppliers.map(function(s){ return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>采购日期</label><input id="poDate" type="date" value="' + todayStr() + '"></div>' +
      '<div class="field full"><label>备注</label><input id="poNote" type="text" placeholder="交期、到货要求等"></div></div>' +
      '<div class="card-title" style="font-size:14px;margin-bottom:8px">明细行</div><div id="poLines"></div>',
    footer: '<span class="left"><button class="btn btn-ghost" data-act="addline" type="button">' + UI.icon('plus',13) + '添加一行</button></span>' +

  });
  var ed = lineEditor(m.el.querySelector('#poLines'), rows);
  m.el.querySelector('[data-act="addline"]').addEventListener('click', function(){ ed.add(); });
  m.el.querySelector('[data-act="cancel"]').addEventListener('click', function(){ m.close(); });
  m.el.querySelector('[data-act="save"]').addEventListener('click', function(){
    var sup = m.el.querySelector('#poSup').value;
    var date = m.el.querySelector('#poDate').value || todayStr();
    var note = m.el.querySelector('#poNote').value.trim();
    if (!sup) { UI.toast('请选择供应商', 'warn'); return; }
    var err = orderLinesValid(ed.rows);
    if (err) { UI.toast(err, 'warn'); return; }
    var lines = ed.rows.map(function(r){ return { pid:r.pid, qty:Number(r.qty), price:Number(r.price), amt:calcAmt(r.qty, r.price) }; });
    var seq = nextSeq('po');
    var id = 'PO' + pad2(seq);
    var no = 'CG' + date.replace(/-/g,'') + String(seq);
    var total = lines.reduce(function(s,l){ return s+l.amt; }, 0);
    addItem(S.purchaseOrders, { id:id, no:no, date:date, supId:sup, note:note, audited:false, closed:false, done:false, total:Math.round(total*100)/100, lines:lines });
    pushNote('pur', '采购单待审核', partnerName('sup', sup) + ' · ' + no, '#/pur?f=pending');
    pushOpLog('新建采购单', no + ' 供应商 ' + partnerName('sup', sup) + '，合计 ' + fmtMoney(total));
    m.close(); UI.toast('采购单已创建，待审核', 'ok');
    renderRoute();
  });
}
function receiveFromPO(po){
  if (!canOp('ib')) { UI.toast('当前账号无此操作权限','err'); return; }
  var rows = po.lines.map(function(l){ return { pid:l.pid, qty:Math.max(0, l.qty - receivedQtyOf(po.id, l.pid)), price:0 }; })
    .filter(function(r){ return r.qty > 0; });
  if (!rows.length) { UI.toast('该采购单已全部入库', 'warn'); return; }
  var m = UI.modal({
    title:'采购入库 · ' + po.no, wide:true,
    body: '<div class="tipbar teal">' + UI.icon('alert',15) + '入库数量默认为未到货余量，可下调；保存后实时增加库存并生成入库单</div>' +
      '<div class="form two" style="margin:12px 0"><div class="field"><label>入库日期</label><input id="ibDate" type="date" value="' + todayStr() + '"></div>' +
      '<div class="field"><label>经手人</label><input id="ibOp" type="text" value="' + currentUser().name + '"></div></div>' +
      '<div id="ibLines"></div>',
    footer: '<button class="btn btn-ghost" data-act="cancel" type="button">取消</button><button class="btn btn-verm" data-act="save" type="button">确认入库</button>'
  });
  var ed = lineEditor(m.el.querySelector('#ibLines'), rows);
  m.el.querySelector('[data-act="cancel"]').addEventListener('click', function(){ m.close(); });
  m.el.querySelector('[data-act="save"]').addEventListener('click', function(){
    var err = orderLinesValid(ed.rows);
    if (err) { UI.toast(err, 'warn'); return; }
    var date = m.el.querySelector('#ibDate').value || todayStr();
    var op = m.el.querySelector('#ibOp').value.trim() || currentUser().name;
    var lines = ed.rows.filter(function(r){ return r.pid && r.qty>0; }).map(function(r){ return { pid:r.pid, qty:Number(r.qty) }; });
    var res = createInbound({ type:'purchase', refId:po.id, date:date, operator:op, lines:lines, note:'采购入库' });
    if (res) { UI.toast(res, 'err'); return; }
    pushNote('ib', '采购入库完成', po.no + ' · ' + lines.length + ' 行', '#/ib');
    pushOpLog('采购入库', po.no + ' 入库 ' + lines.length + ' 行，经手人 ' + op);
    m.close(); UI.toast('入库完成，库存已增加', 'ok');
    renderRoute();
  });
}

  });

  /* 采购入库联动：选择采购单后预填未入库余量 */
  var poSel = m.el.querySelector('#ibPo');
  function fillPOs(){
    var av = S.purchaseOrders.filter(function(po){ var st=poStatus(po); return !po.closed && (st==='audited'||st==='partial'); });

  });

    var type = m.el.querySelector('#obType').value;

    var lines = ed.rows.filter(function(r){ return r.pid && r.qty>0; }).map(function(r){ return { pid:r.pid, qty:Number(r.qty) }; });
    if (!lines.length) { UI.toast('请至少添加一行出库明细', 'warn'); return; }
    var res = createOutbound({ type:type, refId:refId, date:date, operator:op, lines:lines, note:note });
    if (res) { UI.toast(res, 'err'); return; }
    pushNote('ob', '出库单已生成', (type==='sales'?'销售出库':'其他出库') + ' · ' + lines.length + ' 行', '#/ob');
    pushOpLog('生成出库单', (type==='sales'?'销售出库':'其他出库') + ' ' + lines.length + ' 行，经手人 ' + op);
    m.close(); UI.toast('出库单已生成，库存已扣减', 'ok');

'use strict';

/* ---------- 收付款登记（客户 / 供应商 / 订单级） ---------- */
function payModal(scope, id){
  if (!canOp('fin')) { UI.toast('当前账号无此操作权限','err'); return; }
  var type='in', partnerType='crm', partnerId='', refType='', refId='', maxUnpaid=0, title='';
  if (scope==='crm'){
    partnerId = id; title='登记收款 · ' + partnerName('crm', id);
    maxUnpaid = crmFin(id).unpaid;
  } else if (scope==='sup'){
    type='out'; partnerType='sup'; partnerId=id; title='登记付款 · ' + partnerName('sup', id);
    maxUnpaid = supFin(id).unpaid;
  } else if (scope==='so'){
    var so = byId(S.salesOrders, id); if (!so) return;
    partnerId = so.custId; refType='so'; refId=id; title='登记收款 · ' + so.no;
    maxUnpaid = Math.round((so.total - paidOf('so', id))*100)/100;
  } else if (scope==='po'){
    var po = byId(S.purchaseOrders, id); if (!po) return;
    type='out'; partnerType='sup'; partnerId=po.supId; refType='po'; refId=id; title='登记付款 · ' + po.no;
    maxUnpaid = Math.round((po.total - paidOutOf('po', id))*100)/100;
  }
  if (maxUnpaid <= 0.005) { UI.toast('该往来暂无未结余额','warn'); return; }
  var schema = [
    { name:'amount', label:'金额（元）', req:true, type:'number', min:0.01, step:'0.01', help:'本笔可登记上限 ' + fmtMoney(maxUnpaid) },
    { name:'method', label:'结算方式', req:true, type:'select', options:PAY_METHODS, value:PAY_METHODS[0] },
    { name:'date', label:'日期', req:true, type:'date', value:todayStr() },
    { name:'note', label:'备注', type:'text', placeholder:'摘要说明' }
  ];
  var m = UI.modal({
    title: title, wide:false,
    body: '<div class="tipbar teal" style="margin-bottom:14px">' + UI.icon('coin',15) + (type==='in'?'本次收款':'本次付款') + '最多 ' + fmtMoney(maxUnpaid) + '，保存后资金流水自动更新</div>' + UI.form(schema, {}),
    footer: '<button class="btn btn-ghost" data-act="cancel" type="button">取消</button><button class="btn btn-verm" data-act="save" type="button">确认登记</button>'
  });
  UI.setFormSchema(schema);
  m.el.querySelector('[data-act="cancel"]').addEventListener('click', function(){ m.close(); });
  m.el.querySelector('[data-act="save"]').addEventListener('click', function(){
    var r = UI.readForm(m.el);
    if (!r.ok) { UI.toast('请检查必填项','warn'); return; }
    var amount = Number(r.values.amount);
    if (!(amount>0) || amount > maxUnpaid + 1e-6) { UI.toast('金额需在 0 ~ ' + fmtMoney(maxUnpaid) + ' 之间','warn'); return; }
    var err = registerPayment({ type:type, partnerType:partnerType, partnerId:partnerId, refType:refType, refId:refId, amount:amount, method:r.values.method, date:r.values.date||todayStr(), note:r.values.note });
    if (err) { UI.toast(err,'err'); return; }
    pushNote('fin', (type==='in'?'收款到账':'付款登记'), partnerName(partnerType, partnerId) + ' · ' + fmtMoney(amount), type==='in' ? '#/fin?t=ar' : '#/fin?t=ap');
    pushOpLog((type==='in'?'登记收款':'登记付款'), partnerName(partnerType, partnerId) + ' · ' + fmtMoney(amount) + '（' + r.values.method + '）');
    m.close(); UI.toast((type==='in'?'收款':'付款') + '已登记','ok');
    renderRoute();
  });
}

function addUser(){
  if (!canOp('acct')) { UI.toast('当前账号无此操作权限','err'); return; }
  var schema = USER_SCHEMA.map(function(f){ return Object.assign({}, f); });
  schema[3].value = '123456';
  var m = UI.modal({
    title:'新增账号',
    body: UI.form(schema, {}),
    footer:'<button class="btn btn-ghost" data-act="cancel" type="button">取消</button><button class="btn btn-verm" data-act="save" type="button">创建账号</button>'
  });
  UI.setFormSchema(schema);
  m.el.querySelector('[data-act="cancel"]').addEventListener('click', function(){ m.close(); });
  m.el.querySelector('[data-act="save"]').addEventListener('click', function(){
    var r = UI.readForm(m.el);
    if (!r.ok) { UI.toast('请检查必填项','warn'); return; }
    if (S.users.some(function(u){ return u.username.toLowerCase()===r.values.username.toLowerCase(); })) { UI.toast('用户名已存在','err'); return; }
    var id = 'u-' + r.values.username.toLowerCase().replace(/[^a-z0-9]/g,'') + '-' + Math.random().toString(36).slice(2,5);
    addItem(S.users, { id:id, username:r.values.username, name:r.values.name, role:r.values.role, password:r.values.password||'123456', status:Number(r.values.status)||1, lastLogin:'' });
    pushOpLog('新增账号', r.values.username + '（' + r.values.name + '）');
    m.close(); UI.toast('账号已创建','ok');
    renderRoute();
  });
}

'use strict';

var MOD_TITLES = {};

/* ---------- 路由 ---------- */
function parseHash(){
  var h = location.hash || '#/dash';
  if (h === '#/') h = '#/dash';
  var m = h.match(/^#\/([\w-]+)(?:\/([\w-]+))?(?:\?(.*))?$/);
  var mod = m ? m[1] : 'dash';
  var sub = m && m[2] ? m[2] : '';
  var params = {};
  if (m && m[3]) m[3].split('&').forEach(function(p){
    if (!p) return;
    var i = p.indexOf('=');
    var k = i>-1 ? p.slice(0,i) : p, v = i>-1 ? p.slice(i+1) : '';
    try { params[decodeURIComponent(k)] = decodeURIComponent(v); }
    catch(e){ params[k] = v; }
  });
  return { mod:mod, sub:sub, params:params };
}
function renderRoute(){
  route();
}
function route(){
  var ctx = parseHash();
  if (!Views[ctx.mod]) { location.hash = '#/dash'; return; }
  UI.disposeCharts();
  var el = document.getElementById('view');
  window.scrollTo(0, 0);
  Views[ctx.mod].render(el, ctx);
  bindViewActions();
  setActiveNav(ctx.mod);
  setCrumb(ctx.mod, ctx.sub);
  refreshBell();
  closeSidebar();
}

function bindSearch(){

  var timer = null;
  input.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var q = input.value.trim().toLowerCase();
      if (!q){ res.classList.add('hidden'); return; }
      var idx = buildSearchIndex();
      var hits = idx.filter(function(it){ return it.keys.indexOf(q) > -1; }).slice(0,8);
      var items = hits.map(function(h){
        return { icon:h.icon, title:h.title, sub:h.sub, onClick:function(){ input.value=''; res.classList.add('hidden'); location.hash = h.go; } };
      });

      res.classList.add('hidden');
    }, 180);
  });
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){
      var q = input.value.trim().toLowerCase();
      if (!q) return;
      var hits = buildSearchIndex().filter(function(it){ return it.keys.indexOf(q) > -1; });
      if (hits.length){ location.hash = hits[0].go; input.value=''; }

var bellPanelOpen = false;
var bellOutsideBound = false;
var bellRoot = null;
function closeBellPanel(){
  bellPanelOpen = false;
  if (bellRoot) bellRoot.innerHTML = '';
  if (bellOutsideBound){
    document.removeEventListener('click', bellOutsideHandler, true);
    bellOutsideBound = false;
  }

function bellOutsideHandler(ev){
  var btn = document.getElementById('btnBell');
  if (!bellRoot || !bellRoot.firstChild) return;
  if (!bellRoot.firstChild.contains(ev.target) && !btn.contains(ev.target)) closeBellPanel();

function renderBellPanel(){
  if (!bellRoot || !bellRoot.tagName) bellRoot = document.getElementById('bellRoot');
  if (!bellRoot) return;
  var todos = [];
  try { todos = todoList(); }
  catch(err){ todos = []; UI.toast('待办数据异常，已显示空面板','warn'); }
  var html = '<div class="bell-panel"><div class="bp-head">' +
    '<span class="bp-title">待办事项</span>' +
    (todos.length ? '<span class="bp-cnt">' + todos.length + ' 项待办</span>' : '') + '</div>' +
    '<div class="bp-list">';
  if (!todos.length){
    html += '<div class="bp-empty">暂无待办事项，一切清爽</div>';
  } else {
    var grps = [
      { key:'sale',  label:'销售订单待审核', icon:'sale'  },
      { key:'pur',   label:'采购单待审核',   icon:'pur'   },
      { key:'alert', label:'库存告急',       icon:'alert' }
    ];
    grps.forEach(function(g){
      var items = todos.filter(function(t){ return t.grp === g.key; });
      if (!items.length) return;
      html += '<div class="bp-grp">' + UI.icon(g.icon, 13) + g.label + '<span class="bp-grp-n">' + items.length + '</span></div>';
      items.forEach(function(t, idx){
        html += '<div class="bp-item" data-g="' + g.key + '" data-i="' + idx + '">' +
          '<span class="bp-ic">' + UI.icon(t.icon, 14) + '</span>' +
          '<span class="bp-main"><span class="bp-t">' + escHtml(t.title) + '</span>' + (t.meta ? '<span class="bp-s">' + escHtml(t.meta) + '</span>' : '') + '</span>' +
          '<span class="bp-go">前往处理 →</span></div>';
      });
    });
  }
  html += '</div></div>';
  bellRoot.innerHTML = html;
  var panel = bellRoot.firstChild;
  /* 面板固定显示在页面右上角（顶栏下方内容区右上角），不再随铃铛按钮浮动 */
  panel.style.left = 'auto';
  panel.style.right = '24px';
  panel.style.top = '88px';
  bellRoot.querySelectorAll('.bp-item').forEach(function(di){
    di.addEventListener('click', function(){
      var key = di.getAttribute('data-g');
      var idx = Number(di.getAttribute('data-i'));
      var hit = todoList().filter(function(t){ return t.grp === key; })[idx];
      if (!hit) return;
      closeBellPanel();
      if (hit.go) location.hash = hit.go.replace(/^#/, '');
    });
  });
  if (!bellOutsideBound){
    document.addEventListener('click', bellOutsideHandler, true);
    bellOutsideBound = true;
  }
}
var bellSyncing = false;
function openBellPanel(){
  /* 同步防重入：同一事件循环内的重复调用（如多监听叠加）只生效一次 */
  if (bellSyncing) return;
  bellSyncing = true;
  try {
    if (bellPanelOpen){ closeBellPanel(); return; }
    bellPanelOpen = true;
    try { renderBellPanel(); }
    catch(err){
      /* 渲染异常兜底：复位状态并清空面板，保证下次点击仍可重试展开 */
      console.warn('待办面板渲染异常', err);
      bellPanelOpen = false;
      if (bellRoot) bellRoot.innerHTML = '';

  } finally { bellSyncing = false; }
